name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend (artifacts, typecheck, lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build:transit-artifacts
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run lint
      - run: npm run verify:transit-artifacts
      - run: npm run build

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Module import requires APP_KEY (fail-fast startup guard); a dummy value
      # is fine for the test suite, which stubs the DB and external providers.
      APP_KEY: ci-test-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Run deterministic route-intelligence replays
        run: >-
          python -m scripts.replay_route_intelligence
          --json-out validation-results.json
          --text-out validation-report.txt
          --metrics-out validation-metrics.json
          --ablations-out validation-ablations.json
      - name: Preserve deterministic validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: route-intelligence-validation
          path: |
            backend/validation-results.json
            backend/validation-report.txt
            backend/validation-metrics.json
            backend/validation-ablations.json
          # A pytest/setup failure can prevent the replay step from creating
          # artifacts. Preserve them when available without masking the
          # original failure with a second upload error.
          if-no-files-found: warn
          retention-days: 14
