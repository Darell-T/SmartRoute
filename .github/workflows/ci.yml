name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend (typecheck, test, lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run lint
      - run: npm run verify:transit-artifacts
      - run: npm run build

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Module import requires APP_KEY (fail-fast startup guard); a dummy value
      # is fine for the test suite, which stubs the DB and external providers.
      APP_KEY: ci-test-key
      # The enabled agent validates server-only configuration at import. Tests
      # replace all model calls, so this sentinel is never sent externally.
      ANTHROPIC_API_KEY: ci-test-anthropic-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q

  dependency-advisories:
    name: Dependency advisories (candidate-bound)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install pinned advisory scanner
        run: python -m pip install pip-audit==2.10.1
      - name: Scan declared dependency inputs and build sanitized evidence
        working-directory: backend
        run: |
          set +e
          (cd ../frontend && npm audit --json) > "$RUNNER_TEMP/npm-audit-full.json" 2> "$RUNNER_TEMP/npm-audit-full.err"
          npm_full_exit=$?
          (cd ../frontend && npm audit --omit=dev --json) > "$RUNNER_TEMP/npm-audit-runtime.json" 2> "$RUNNER_TEMP/npm-audit-runtime.err"
          npm_runtime_exit=$?
          pip-audit -r requirements.txt --format json > "$RUNNER_TEMP/pip-audit-runtime.json" 2> "$RUNNER_TEMP/pip-audit-runtime.err"
          pip_runtime_exit=$?
          pip-audit -r requirements-dev.txt --format json > "$RUNNER_TEMP/pip-audit-development.json" 2> "$RUNNER_TEMP/pip-audit-development.err"
          pip_development_exit=$?
          set -e
          python -m scripts.release.dependency_advisory_evidence \
            --commit-sha "${{ github.sha }}" \
            --npm-version "$(cd ../frontend && npm --version)" \
            --pip-audit-version "$(pip-audit --version)" \
            --npm-full-report "$RUNNER_TEMP/npm-audit-full.json" \
            --npm-full-exit-code "$npm_full_exit" \
            --npm-runtime-report "$RUNNER_TEMP/npm-audit-runtime.json" \
            --npm-runtime-exit-code "$npm_runtime_exit" \
            --pip-runtime-report "$RUNNER_TEMP/pip-audit-runtime.json" \
            --pip-runtime-exit-code "$pip_runtime_exit" \
            --pip-development-report "$RUNNER_TEMP/pip-audit-development.json" \
            --pip-development-exit-code "$pip_development_exit" \
            --frontend-lock ../frontend/package-lock.json \
            --backend-requirements requirements.txt \
            --backend-dev-requirements requirements-dev.txt \
            --exception-policy release_advisory_exceptions.json \
            --output test-results/release/dependency-advisories.json
      - name: Preserve sanitized dependency advisory evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-advisory-evidence
          path: backend/test-results/release/dependency-advisories.json
          if-no-files-found: warn
          retention-days: 14
