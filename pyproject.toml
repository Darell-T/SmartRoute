[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "A",
    "C4",
    "SIM",
    "BLE",
    "TRY",
    "ERA",
    "ARG",
    "ASYNC",
    "S",
    "TID",
    "RUF",
    "PERF",
    "FURB",
    "LOG",
    "PT",
    "C901",
    "PLR0912",
    "PLR0915",
]
ignore = ["E501", "S101", "TRY003"]

# Keep Ruff's documented structural defaults. Cognitive complexity is tracked
# separately because McCabe does not penalize nesting.
[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-branches = 12
max-statements = 50

[tool.complexipy]
paths = ["backend/app"]
max-complexity-allowed = 10
no-ignore = true

[tool.complexipy.diff]
branch = "HEAD"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"httpx.Client" = { msg = "Use the project's shared HTTP client wrapper" }
"httpx.AsyncClient" = { msg = "Use the project's shared async HTTP client" }
"requests" = { msg = "Prefer the project's HTTP abstraction" }
"datetime.datetime.utcnow" = { msg = "Use datetime.datetime.now(datetime.UTC)" }
"pkg_resources" = { msg = "Use importlib.resources or importlib.metadata" }

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ARG"]
"__init__.py" = ["F401", "F403"]
"backend/app/services/agent/tools/provider_http.py" = ["TID251"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
