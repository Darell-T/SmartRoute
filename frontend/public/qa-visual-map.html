<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>SmartRoute visual QA</title>
<style>
  html, body, #map { margin: 0; padding: 0; height: 100%; width: 100%; }
  body { background: #000; }
</style>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
</head>
<body>
<div id="map"></div>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
(async () => {
  const map = new maplibregl.Map({
    container: "map",
    style: "https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json",
    center: [-73.9857, 40.7484],
    zoom: 12,
    pitch: 0,
    bearing: 0,
  });
  window.__qaMap = map;

  await new Promise((resolve) => map.on("load", resolve));

  const visual = await fetch("/subway-network.visual.geojson").then((r) => r.json());
  const firstSymbolLayer = (() => {
    const layers = map.getStyle().layers || [];
    for (const l of layers) if (l.type === "symbol") return l.id;
    return undefined;
  })();

  map.addSource("subway-visual", { type: "geojson", data: visual });
  map.addLayer({
    id: "subway-visual-casing",
    type: "line",
    source: "subway-visual",
    layout: { "line-cap": "round", "line-join": "round" },
    paint: {
      "line-color": "#000000",
      "line-opacity": 0.85,
      "line-width": [
        "interpolate", ["linear"], ["zoom"],
        11, 1.6, 14, 3.2, 17, 5.0,
      ],
    },
  }, firstSymbolLayer);

  map.addLayer({
    id: "subway-visual-fill",
    type: "line",
    source: "subway-visual",
    layout: {
      "line-cap": "round",
      "line-join": "round",
      "line-sort-key": ["coalesce", ["get", "visual_z_order"], 0],
    },
    paint: {
      "line-color": ["get", "color"],
      "line-width": [
        "interpolate", ["linear"], ["zoom"],
        11, 1.0, 14, 2.0, 17, 3.2,
      ],
    },
  }, firstSymbolLayer);

  // Signal readiness so the screenshot script can flyTo each scene.
  window.__qaReady = true;
  document.title = "READY";

  console.log("[qa-harness] loaded " + visual.features.length + " visual features");
})();
</script>
</body>
</html>
